<div class="container">
    <!-- Add Action Form -->
    <div class="form-section">
      <h2>Add New Sustainability Action</h2>
      <form (ngSubmit)="onSubmit()" #actionForm="ngForm">
        <div class="form-group">
          <label for="action">Action Name:</label>
          <input 
            type="text" 
            id="action"
            name="action"
            [(ngModel)]="newAction.action"
            required
            class="form-control">
        </div>
  
        <div class="form-group">
          <label for="date">Date:</label>
          <input 
            type="date" 
            id="date"
            name="date"
            [(ngModel)]="newAction.date"
            required
            class="form-control">
        </div>
  
        <div class="form-group">
          <label for="points">Points:</label>
          <input 
            type="number" 
            id="points"
            name="points"
            [(ngModel)]="newAction.points"
            required
            class="form-control">
        </div>
  
        <button type="submit" [disabled]="!actionForm.form.valid">Add Action</button>
      </form>
    </div>
  
    <!-- Actions Table -->
    <div class="table-section">
      <h2>Sustainability Actions</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Action</th>
            <th>Date</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let action of actions">
            <td>{{action.id}}</td>
            <td>{{action.action}}</td>
            <td>{{action.date}}</td>
            <td>{{action.points}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
